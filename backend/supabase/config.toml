project_id = "xueqing-native-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/invitation"]
jwt_expiry = 3600
enable_signup = true

[functions.organization-invitation-delivery]
# The function performs no privileged action before the caller token reaches
# the user-scoped, server-authoritative begin-delivery RPC. Keep gateway JWT
# verification off so current asymmetric Supabase Auth JWTs are supported.
verify_jwt = false
