name: android-observation-slice

on:
  pull_request:
    paths:
      # Provider/schema E2E should follow provider, persistence and shared
      # contract boundaries. Pure Compose/ViewModel presentation refactors are
      # covered by android-spike and must not start a Supabase stack by themselves.
      - 'apps/android/build.gradle.kts'
      - 'apps/android/settings.gradle.kts'
      - 'apps/android/gradle.properties'
      - 'apps/android/gradle/**'
      - 'apps/android/app/build.gradle.kts'
      - 'apps/android/app/schemas/**'
      - 'apps/android/app/src/main/java/com/xueqing/app/XueqingApplication.kt'
      - 'apps/android/app/src/main/java/com/xueqing/app/application/**'
      - 'apps/android/app/src/main/java/com/xueqing/app/durability/**'
      - 'apps/android/app/src/main/java/com/xueqing/app/infrastructure/**'
      - 'apps/android/app/src/debug/java/com/xueqing/app/BuildVariantLearningReadBootstrap.kt'
      - 'apps/android/app/src/debug/java/com/xueqing/app/BuildVariantQuickCaptureBootstrap.kt'
      - 'apps/android/app/src/release/java/com/xueqing/app/BuildVariantLearningReadBootstrap.kt'
      - 'apps/android/app/src/release/java/com/xueqing/app/BuildVariantQuickCaptureBootstrap.kt'
      - 'apps/android/app/src/androidTest/java/com/xueqing/app/durability/ObservationReferenceProviderE2ETest.kt'
      - 'apps/android/app/src/androidTest/java/com/xueqing/app/infrastructure/remote/LearningReadReferenceProviderE2ETest.kt'
      - 'backend/supabase/**'
      - 'contracts/commands/CREATE_OBSERVATION_V1.md'
      - 'contracts/commands/COMMIT_OBSERVATION_ATTACHMENT_V1.md'
      - 'contracts/attachments/**'
      - 'contracts/commands/CREATE_LEARNING_CASE_V1.md'
      - 'contracts/errors/CREATE_OBSERVATION_ERRORS.md'
      - 'contracts/projections/PERSONAL_BOOTSTRAP_V1.md'
      - 'contracts/projections/PERSONAL_TODAY_ACTIONS_V1.md'
      - 'contracts/projections/STUDENT_LEARNING_FOCUS_V1.md'
      - '.github/workflows/android-observation-slice.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-observation-slice-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  room-v3-contract:
    name: room-v3-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '8.13'

      - name: Install pinned Android API 36 packages
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - name: Enforce frozen Android product dependencies
        shell: bash
        run: |
          set -euo pipefail
          app_build='apps/android/app/build.gradle.kts'
          grep -Fq 'compileSdk = 36' "$app_build"
          grep -Fq 'targetSdk = 36' "$app_build"
          grep -Fq 'val roomVersion = "2.8.5"' "$app_build"
          grep -Fq 'val workVersion = "2.11.2"' "$app_build"
          grep -Fq 'net.zetetic:sqlcipher-android:4.17.0@aar' "$app_build"
          grep -Fq 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0' "$app_build"

      - name: Compile Android product and generate Room schema
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          gradle -p apps/android :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin --no-daemon --stacktrace

      - name: Verify committed Room v1, v2 and v3 schemas are exact
        shell: bash
        run: |
          set -euo pipefail
          schema_dir='apps/android/app/schemas/com.xueqing.app.durability.DraftDatabase'
          test -f "$schema_dir/1.json"
          test -f "$schema_dir/2.json"
          test -f "$schema_dir/3.json"
          status="$(git status --porcelain -- apps/android/app/schemas)"
          if [ -n "$status" ]; then
            echo 'Room schema drift detected:' >&2
            printf '%s\n' "$status" >&2
            git diff -- apps/android/app/schemas >&2 || true
            exit 1
          fi

      - name: Upload generated Room schema evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-observation-room-schema
          path: apps/android/app/schemas/com.xueqing.app.durability.DraftDatabase
          if-no-files-found: error
          retention-days: 7

  reference-provider-e2e:
    name: reference-provider-e2e
    needs: room-v3-contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup stable Supabase CLI 2.117.0
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '8.13'

      - name: Start clean fictional reference provider
        shell: bash
        run: |
          set -euo pipefail
          supabase start --workdir backend
          supabase db reset --workdir backend

      - name: Create ephemeral fictional teacher JWT
        shell: bash
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/supabase-local.env"
          supabase status --workdir backend -o env > "$env_file"
          set -a
          source "$env_file"
          set +a
          : "${JWT_SECRET:?JWT_SECRET missing from local Supabase status}"
          : "${ANON_KEY:?ANON_KEY missing from local Supabase status}"

          access_token="$(python3 - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import time

          def b64url(value: bytes) -> str:
              return base64.urlsafe_b64encode(value).rstrip(b'=').decode('ascii')

          now = int(time.time())
          header = {"alg": "HS256", "typ": "JWT"}
          payload = {
              "iss": "supabase-demo",
              "sub": "a0000000-0000-0000-0000-000000000001",
              "aud": "authenticated",
              "role": "authenticated",
              "iat": now,
              "exp": now + 3600,
          }
          encoded_header = b64url(json.dumps(header, separators=(',', ':')).encode())
          encoded_payload = b64url(json.dumps(payload, separators=(',', ':')).encode())
          signing_input = f"{encoded_header}.{encoded_payload}".encode()
          signature = hmac.new(
              os.environ["JWT_SECRET"].encode(),
              signing_input,
              hashlib.sha256,
          ).digest()
          print(f"{encoded_header}.{encoded_payload}.{b64url(signature)}")
          PY
          )"

          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$access_token"
          {
            echo "REFERENCE_ANON_KEY=$ANON_KEY"
            echo "REFERENCE_ACCESS_TOKEN=$access_token"
          } >> "$GITHUB_ENV"

      - name: Install API 36 emulator image
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          mkdir -p "$ANDROID_AVD_HOME"
          "$sdkmanager" 'platform-tools' 'emulator' 'platforms;android-36' 'build-tools;35.0.0' 'system-images;android-36;google_apis;x86_64'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name xueqing-reference-provider \
            --package 'system-images;android-36;google_apis;x86_64' \
            --device pixel_6

      - name: Boot emulator
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          adb="$ANDROID_HOME/platform-tools/adb"
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd xueqing-reference-provider \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-metrics \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none \
            > "$RUNNER_TEMP/xueqing-reference-emulator.log" 2>&1 &

          "$adb" wait-for-device
          for attempt in $(seq 1 120); do
            if [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            if [ "$attempt" -eq 120 ]; then
              cat "$RUNNER_TEMP/xueqing-reference-emulator.log" >&2
              exit 1
            fi
            sleep 2
          done
          "$adb" shell input keyevent 82 || true
          "$adb" devices -l

      - name: Run Android Observation and Learning read reference-provider E2E
        shell: bash
        run: |
          set -euo pipefail
          gradle -p apps/android :app:connectedDebugAndroidTest --no-daemon --stacktrace \
            -Pandroid.testInstrumentationRunnerArguments.class=com.xueqing.app.durability.ObservationReferenceProviderE2ETest,com.xueqing.app.infrastructure.remote.LearningReadReferenceProviderE2ETest \
            -Pandroid.testInstrumentationRunnerArguments.xueqingRpcBaseUrl=http://10.0.2.2:54321 \
            -Pandroid.testInstrumentationRunnerArguments.xueqingPublishableKey="$REFERENCE_ANON_KEY" \
            -Pandroid.testInstrumentationRunnerArguments.xueqingAccessToken="$REFERENCE_ACCESS_TOKEN"

      - name: Verify both E2E instrumentation tests executed exactly once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          files = glob.glob('apps/android/app/build/outputs/androidTest-results/connected/debug/**/TEST-*.xml', recursive=True)
          total = failures = errors = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              total += int(root.attrib.get('tests', '0'))
              failures += int(root.attrib.get('failures', '0'))
              errors += int(root.attrib.get('errors', '0'))
              skipped += int(root.attrib.get('skipped', '0'))
          print(f'Reference-provider E2E: tests={total}, failures={failures}, errors={errors}, skipped={skipped}')
          if (total, failures, errors, skipped) != (2, 0, 0, 0):
              raise SystemExit('Expected exactly two successful, non-skipped reference-provider E2E tests.')
          PY

      - name: Verify one authoritative Observation and receipt
        shell: bash
        run: |
          set -euo pipefail
          operation_id='70000000-0000-0000-0000-000000000001'
          expected_actor='10000000-0000-0000-0000-000000000001'
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          test -n "$db_container"

          observation_count="$(docker exec -i "$db_container" psql -U postgres -d postgres -Atc "select count(*) from public.observations where operation_id = '$operation_id'::uuid")"
          receipt_count="$(docker exec -i "$db_container" psql -U postgres -d postgres -Atc "select count(*) from public.operation_receipts where operation_id = '$operation_id'::uuid")"
          actor_id="$(docker exec -i "$db_container" psql -U postgres -d postgres -Atc "select actor_app_user_id from public.observations where operation_id = '$operation_id'::uuid")"
          if [ "$observation_count" != '1' ] || [ "$receipt_count" != '1' ] || [ "$actor_id" != "$expected_actor" ]; then
            echo "Reference-provider mismatch: observations=$observation_count receipts=$receipt_count actor=$actor_id" >&2
            exit 1
          fi

          learning_operation_id='78000000-0000-0000-0000-000000000001'
          learning_receipt_count="$(docker exec -i "$db_container" psql -U postgres -d postgres -Atc "select count(*) from public.operation_receipts where operation_id = '$learning_operation_id'::uuid")"
          learning_case_count="$(docker exec -i "$db_container" psql -U postgres -d postgres -Atc "select count(*) from public.learning_cases where id = (select (result_payload ->> 'case_id')::uuid from public.operation_receipts where operation_id = '$learning_operation_id'::uuid)")"
          learning_action_count="$(docker exec -i "$db_container" psql -U postgres -d postgres -Atc "select count(*) from public.learning_case_actions where case_id = (select (result_payload ->> 'case_id')::uuid from public.operation_receipts where operation_id = '$learning_operation_id'::uuid) and action_role = 'primary' and status = 'pending'")"
          if [ "$learning_receipt_count" != '1' ] || [ "$learning_case_count" != '1' ] || [ "$learning_action_count" != '1' ]; then
            echo "Learning-read fixture mismatch: receipts=$learning_receipt_count cases=$learning_case_count pending_primary_actions=$learning_action_count" >&2
            exit 1
          fi

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-observation-reference-provider-e2e
          path: |
            apps/android/app/build/outputs/androidTest-results/connected/debug
            apps/android/app/build/reports/androidTests/connected/debug
          if-no-files-found: warn
          retention-days: 7

      - name: Print local diagnostics on failure
        if: failure()
        shell: bash
        run: |
          supabase status --workdir backend || true
          docker ps -a || true
          cat "$RUNNER_TEMP/xueqing-reference-emulator.log" || true

      - name: Stop local Supabase stack
        if: always()
        shell: bash
        run: supabase stop --workdir backend || true
