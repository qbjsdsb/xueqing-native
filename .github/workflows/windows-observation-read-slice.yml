name: windows-observation-read-slice

on:
  pull_request:
    paths:
      - 'apps/windows/src/Xueqing.Windows.Core/**'
      - 'apps/windows/src/Xueqing.Windows.Infrastructure/**'
      - 'apps/windows/tests/Xueqing.Windows.ReferenceProviderE2E/**'
      - 'backend/supabase/**'
      - 'contracts/projections/**'
      - '.github/workflows/windows-observation-read-slice.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-observation-read-slice-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference-provider-e2e:
    name: reference-provider-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup .NET 10.0.401
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.401'

      - name: Setup stable Supabase CLI 2.117.0
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.117.0

      - name: Start clean fictional reference provider
        shell: bash
        run: |
          set -euo pipefail
          supabase start --workdir backend
          supabase db reset --workdir backend

      - name: Create ephemeral fictional teacher JWT
        shell: bash
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/supabase-local.env"
          supabase status --workdir backend -o env > "$env_file"
          set -a
          source "$env_file"
          set +a
          : "${JWT_SECRET:?JWT_SECRET missing from local Supabase status}"
          : "${ANON_KEY:?ANON_KEY missing from local Supabase status}"

          access_token="$(python3 - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import time

          def b64url(value: bytes) -> str:
              return base64.urlsafe_b64encode(value).rstrip(b'=').decode('ascii')

          now = int(time.time())
          header = {"alg": "HS256", "typ": "JWT"}
          payload = {
              "iss": "supabase-demo",
              "sub": "a0000000-0000-0000-0000-000000000001",
              "aud": "authenticated",
              "role": "authenticated",
              "iat": now,
              "exp": now + 3600,
          }
          encoded_header = b64url(json.dumps(header, separators=(',', ':')).encode())
          encoded_payload = b64url(json.dumps(payload, separators=(',', ':')).encode())
          signing_input = f"{encoded_header}.{encoded_payload}".encode()
          signature = hmac.new(os.environ["JWT_SECRET"].encode(), signing_input, hashlib.sha256).digest()
          print(f"{encoded_header}.{encoded_payload}.{b64url(signature)}")
          PY
          )"

          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$access_token"
          {
            echo "XUEQING_REFERENCE_PROVIDER_URL=http://127.0.0.1:54321/"
            echo "XUEQING_REFERENCE_API_KEY=$ANON_KEY"
            echo "XUEQING_REFERENCE_ACCESS_TOKEN=$access_token"
          } >> "$GITHUB_ENV"

      - name: Build Windows reference-provider E2E
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore apps/windows/src/Xueqing.Windows.Infrastructure/Xueqing.Windows.Infrastructure.csproj --locked-mode
          dotnet build apps/windows/tests/Xueqing.Windows.ReferenceProviderE2E/Xueqing.Windows.ReferenceProviderE2E.csproj -c Release --nologo

      - name: Run Windows Core projection and coordinator tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet test apps/windows/tests/Xueqing.Windows.Core.Tests/Xueqing.Windows.Core.Tests.csproj \
            -c Release \
            --nologo

      - name: Run Bootstrap, Observation and Learning read-model E2E
        shell: bash
        run: |
          set -euo pipefail
          output=apps/windows/tests/Xueqing.Windows.ReferenceProviderE2E/bin/Release/net10.0
          "$output/Xueqing.Windows.ReferenceProviderE2E" \
            --minimum-expected-tests 2 \
            --no-banner \
            --progress off \
            --output Detailed

      - name: Print reference-provider diagnostics on failure
        if: failure()
        shell: bash
        run: |
          supabase status --workdir backend || true
          docker ps -a || true

      - name: Stop local Supabase stack
        if: always()
        shell: bash
        run: |
          supabase stop --workdir backend || true
