name: windows-observation-read-slice

on:
  pull_request:
    paths:
      - 'apps/windows/src/Xueqing.Windows.Core/**'
      - 'apps/windows/src/Xueqing.Windows.Infrastructure/**'
      - 'apps/windows/tests/Xueqing.Windows.ReferenceProviderE2E/**'
      - 'backend/supabase/**'
      - 'contracts/projections/**'
      - 'contracts/commands/**'
      - '.github/workflows/windows-observation-read-slice.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-observation-read-slice-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference-provider-e2e:
    name: reference-provider-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup .NET 10.0.401
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.401'

      - name: Setup stable Supabase CLI 2.117.0
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.117.0

      - name: Start clean fictional reference provider
        shell: bash
        run: |
          set -euo pipefail
          supabase start --workdir backend
          supabase db reset --workdir backend

      - name: Create ephemeral fictional owner and invitee JWTs
        shell: bash
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/supabase-local.env"
          supabase status --workdir backend -o env > "$env_file"
          set -a
          source "$env_file"
          set +a
          : "${JWT_SECRET:?JWT_SECRET missing from local Supabase status}"
          : "${ANON_KEY:?ANON_KEY missing from local Supabase status}"

          make_jwt() {
            JWT_SUBJECT="$1" JWT_EMAIL="$2" python3 - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import time

          def b64url(value: bytes) -> str:
              return base64.urlsafe_b64encode(value).rstrip(b'=').decode('ascii')

          now = int(time.time())
          payload = {
              "iss": "supabase-demo",
              "sub": os.environ["JWT_SUBJECT"],
              "aud": "authenticated",
              "role": "authenticated",
              "iat": now,
              "exp": now + 3600,
          }
          email = os.environ.get("JWT_EMAIL", "")
          if email:
              payload["email"] = email
              payload["is_anonymous"] = False

          header = {"alg": "HS256", "typ": "JWT"}
          encoded_header = b64url(json.dumps(header, separators=(',', ':')).encode())
          encoded_payload = b64url(json.dumps(payload, separators=(',', ':')).encode())
          signing_input = f"{encoded_header}.{encoded_payload}".encode()
          signature = hmac.new(
              os.environ["JWT_SECRET"].encode(),
              signing_input,
              hashlib.sha256,
          ).digest()
          print(f"{encoded_header}.{encoded_payload}.{b64url(signature)}")
          PY
          }

          access_token="$(make_jwt 'a0000000-0000-0000-0000-000000000001' '')"
          invitee_access_token="$(make_jwt 'b0000000-0000-0000-0000-00000000e201' 'windows.acceptance@example.com')"

          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$access_token"
          echo "::add-mask::$invitee_access_token"
          {
            echo "XUEQING_REFERENCE_PROVIDER_URL=http://127.0.0.1:54321/"
            echo "XUEQING_REFERENCE_API_KEY=$ANON_KEY"
            echo "XUEQING_REFERENCE_ACCESS_TOKEN=$access_token"
            echo "XUEQING_REFERENCE_INVITEE_ACCESS_TOKEN=$invitee_access_token"
          } >> "$GITHUB_ENV"

      - name: Start invitation delivery reference adapter
        shell: bash
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/invitation-delivery.env"
          log_file="$RUNNER_TEMP/invitation-delivery.log"
          pid_file="$RUNNER_TEMP/invitation-delivery.pid"

          cat > "$env_file" <<'EOF'
          XUEQING_LOCAL_REFERENCE_MODE=1
          XUEQING_INVITATION_REDIRECT_URL=http://127.0.0.1:3000/invitation
          EOF

          nohup supabase functions serve organization-invitation-delivery \
            --workdir backend \
            --env-file "$env_file" \
            >"$log_file" 2>&1 &
          echo "$!" > "$pid_file"

          ready=false
          for _ in $(seq 1 60); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              -X OPTIONS \
              http://127.0.0.1:54321/functions/v1/organization-invitation-delivery || true)"
            if [[ "$status" == "200" ]]; then
              ready=true
              break
            fi

            if ! kill -0 "$(cat "$pid_file")" >/dev/null 2>&1; then
              cat "$log_file" >&2
              echo "Invitation delivery function exited before becoming ready." >&2
              exit 1
            fi
            sleep 1
          done

          if [[ "$ready" != "true" ]]; then
            cat "$log_file" >&2
            echo "Invitation delivery function did not become ready." >&2
            exit 1
          fi

      - name: Build Windows reference-provider E2E
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore apps/windows/src/Xueqing.Windows.Infrastructure/Xueqing.Windows.Infrastructure.csproj --locked-mode
          dotnet build apps/windows/tests/Xueqing.Windows.ReferenceProviderE2E/Xueqing.Windows.ReferenceProviderE2E.csproj -c Release --nologo

      - name: Run Windows Core projection and coordinator tests
        shell: bash
        run: |
          set -euo pipefail
          project=apps/windows/tests/Xueqing.Windows.Core.Tests/Xueqing.Windows.Core.Tests.csproj
          dotnet build "$project" -c Release --nologo
          output=apps/windows/tests/Xueqing.Windows.Core.Tests/bin/Release/net10.0
          "$output/Xueqing.Windows.Core.Tests" \
            --minimum-expected-tests 18 \
            --no-banner \
            --progress off \
            --output Detailed

      - name: Run Bootstrap, Organization, Invitation Acceptance, Observation, Learning and Action progression E2E
        shell: bash
        run: |
          set -euo pipefail
          output=apps/windows/tests/Xueqing.Windows.ReferenceProviderE2E/bin/Release/net10.0
          "$output/Xueqing.Windows.ReferenceProviderE2E" \
            --minimum-expected-tests 8 \
            --no-banner \
            --progress off \
            --output Detailed

      - name: Print reference-provider diagnostics on failure
        if: failure()
        shell: bash
        run: |
          supabase status --workdir backend || true
          docker ps -a || true

      - name: Stop local Supabase stack
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/invitation-delivery.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/invitation-delivery.pid")" >/dev/null 2>&1 || true
          fi
          supabase stop --workdir backend || true
