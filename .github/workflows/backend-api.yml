name: backend-api

on:
  pull_request:
    paths:
      - 'backend/supabase/**'
      - 'contracts/commands/**'
      - 'contracts/projections/**'
      - 'contracts/errors/**'
      - '.github/workflows/backend-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-api-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  create-observation-contract:
    name: create-observation-contract
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup stable Supabase CLI 2.117.0
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0

      - name: Print toolchain
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          docker version

      - name: Start clean local Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          supabase start --workdir backend
          supabase db reset --workdir backend

      - name: Lint public database functions
        shell: bash
        run: |
          set -euo pipefail
          supabase db lint --workdir backend --schema public --level warning --fail-on error

      - name: Run pgTAP authorization, idempotency and atomicity gate
        shell: bash
        run: |
          set -euo pipefail
          supabase test db --workdir backend

      - name: Prove concurrent authority revoke cannot pass an in-flight command
        shell: bash
        run: |
          set -euo pipefail
          bash backend/supabase/tests/create_observation_concurrency.sh

      - name: Prove concurrent Case authority revoke cannot pass an in-flight command
        shell: bash
        run: |
          set -euo pipefail
          bash backend/supabase/tests/create_learning_case_concurrency.sh

      - name: Prove Action progression locks authority and competing mutations
        shell: bash
        run: |
          set -euo pipefail
          bash backend/supabase/tests/action_progression_concurrency.sh

      - name: Prove Case lifecycle locks authority and competing Action mutation
        shell: bash
        run: |
          set -euo pipefail
          bash backend/supabase/tests/case_lifecycle_concurrency.sh

      - name: Prove provider-issued old tokens fail closed after live authority revoke
        shell: bash
        run: |
          set -euo pipefail
          bash backend/supabase/tests/provider_session_auth_conformance.sh

      - name: Prove provider identities resolve through application-owned IdentityLink
        shell: bash
        run: |
          set -euo pipefail
          bash backend/supabase/tests/provider_adapter_conformance.sh

      - name: Prove Organization invitation locks live management authority
        shell: bash
        run: |
          set -euo pipefail
          bash backend/supabase/tests/organization_invitation_concurrency.sh

      - name: Prove Observation Attachment Storage RLS and immutable commit boundary
        shell: bash
        run: |
          set -euo pipefail
          bash backend/supabase/tests/observation_attachment_storage_conformance.sh

      - name: Prove Observation Attachment commit locks live teaching authority
        shell: bash
        run: |
          set -euo pipefail
          bash backend/supabase/tests/observation_attachment_concurrency.sh

      - name: Print safe local-stack diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true

      - name: Stop local Supabase stack
        if: always()
        shell: bash
        run: supabase stop --workdir backend || true
