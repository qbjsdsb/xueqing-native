name: android-spike

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

concurrency:
  group: android-spike-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: android-bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify runner Android SDK and install pinned packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$sdkmanager" --version
          "$sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '8.13'

      - name: Print Android bootstrap toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Enforce stable API 36 dependency policy
        shell: bash
        run: |
          set -euo pipefail
          app_build='apps/android/app/build.gradle.kts'
          root_build='apps/android/build.gradle.kts'
          workflow='.github/workflows/android-spike.yml'
          stable_api=36
          next_api=$((stable_api + 1))

          grep -Eq "compileSdk[[:space:]]*=[[:space:]]*$stable_api" "$app_build"
          grep -Eq "targetSdk[[:space:]]*=[[:space:]]*$stable_api" "$app_build"
          grep -Fq "platforms;android-$stable_api" "$workflow"
          grep -Fq 'val roomVersion = "2.8.5"' "$app_build"
          grep -Fq 'val lifecycleVersion = "2.10.0"' "$app_build"
          grep -Fq 'net.zetetic:sqlcipher-android:4.17.0@aar' "$app_build"
          grep -Fq 'androidx.sqlite:sqlite:2.7.0' "$app_build"

          if grep -Eq "(compileSdk|targetSdk)[[:space:]]*=[[:space:]]*$next_api|compileSdkPreview|targetSdkPreview" "$app_build"; then
            echo 'Preview/API 37 SDK configuration is not allowed in the stable bootstrap.' >&2
            exit 1
          fi

          if grep -Fq "platforms;android-$next_api" "$workflow"; then
            echo 'The CI bootstrap must not install the API 37 platform.' >&2
            exit 1
          fi

          if grep -Eq 'version[[:space:]]+"[^"]*(\+|SNAPSHOT|alpha|beta|rc[0-9])' "$root_build" "$app_build"; then
            echo 'Dynamic or prerelease build/plugin versions are not allowed in the stable bootstrap.' >&2
            exit 1
          fi

          if grep -R -n 'androidx\.security\.crypto' apps/android/app/src "$app_build"; then
            echo 'Deprecated androidx.security.crypto APIs are not allowed in the encrypted baseline.' >&2
            exit 1
          fi

      - name: Verify encrypted Durable Intent backup exclusions
        shell: bash
        run: |
          set -euo pipefail
          manifest='apps/android/app/src/main/AndroidManifest.xml'
          backup='apps/android/app/src/main/res/xml/backup_rules.xml'
          extraction='apps/android/app/src/main/res/xml/data_extraction_rules.xml'
          grep -Fq 'android:fullBackupContent="@xml/backup_rules"' "$manifest"
          grep -Fq 'android:dataExtractionRules="@xml/data_extraction_rules"' "$manifest"
          grep -Fq '<exclude domain="database" path="." />' "$backup"
          test "$(grep -Fc '<exclude domain="database" path="." />' "$extraction")" -eq 2
          grep -Fq 'context.noBackupFilesDir' apps/android/app/src/main/java/com/xueqing/app/durability/EncryptedDatabaseKeyManager.kt

      - name: Validate Android AAR metadata
        shell: bash
        run: |
          set -euo pipefail
          gradle -p apps/android :app:checkDebugAarMetadata --no-daemon --stacktrace

      - name: Run Android unit tests
        shell: bash
        run: |
          set -euo pipefail
          gradle -p apps/android :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Verify non-zero Android unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          files = glob.glob('apps/android/app/build/test-results/testDebugUnitTest/TEST-*.xml')
          test_count = sum(int(ET.parse(path).getroot().attrib.get('tests', '0')) for path in files)
          print(f'Android unit tests executed: {test_count}')
          if test_count < 1:
              raise SystemExit('Expected at least one executed Android unit test.')
          PY

      - name: Verify committed Room schema matches generated schema
        shell: bash
        run: |
          set -euo pipefail
          schema_dir='apps/android/app/schemas/com.xueqing.app.durability.DraftDatabase'
          test -f "$schema_dir/1.json"
          test -f "$schema_dir/2.json"
          test -f "$schema_dir/3.json"
          git diff --exit-code -- apps/android/app/schemas

      - name: Run Android lint
        shell: bash
        run: |
          set -euo pipefail
          gradle -p apps/android :app:lintDebug --no-daemon --stacktrace

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p apps/android :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Android UX acceptance debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-ux-acceptance-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

  durability-device:
    name: android-draft-durability-device
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '8.13'

      - name: Install API 36 emulator image
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          mkdir -p "$ANDROID_AVD_HOME"
          "$sdkmanager" 'platform-tools' 'emulator' 'platforms;android-36' 'build-tools;35.0.0' 'system-images;android-36;google_apis;x86_64'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name xueqing-ci \
            --package 'system-images;android-36;google_apis;x86_64' \
            --device pixel_6
          "$ANDROID_HOME/emulator/emulator" -list-avds

      - name: Boot emulator
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          adb="$ANDROID_HOME/platform-tools/adb"
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd xueqing-ci \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none \
            > "$RUNNER_TEMP/xueqing-emulator.log" 2>&1 &

          "$adb" wait-for-device
          for attempt in $(seq 1 120); do
            if [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            if [ "$attempt" -eq 120 ]; then
              cat "$RUNNER_TEMP/xueqing-emulator.log" >&2
              exit 1
            fi
            sleep 2
          done
          "$adb" shell input keyevent 82 || true
          "$adb" devices -l

      - name: Run encrypted draft and Quick Capture instrumentation tests
        shell: bash
        run: |
          set -euo pipefail
          gradle -p apps/android :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Report instrumentation test results
        if: always()
        shell: bash
        run: |
          set -o pipefail
          diagnostic_dir='artifacts/android-draft-durability/diagnostics'
          mkdir -p "$diagnostic_dir"
          python3 - <<'PY' | tee "$diagnostic_dir/instrumentation-summary.txt"
          import glob
          import xml.etree.ElementTree as ET

          files = glob.glob('apps/android/app/build/outputs/androidTest-results/connected/debug/**/TEST-*.xml', recursive=True)
          print(f'Instrumentation XML files: {len(files)}')
          total = failures = errors = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              total += int(root.attrib.get('tests', '0'))
              failures += int(root.attrib.get('failures', '0'))
              errors += int(root.attrib.get('errors', '0'))
              skipped += int(root.attrib.get('skipped', '0'))
              for case in root.findall('.//testcase'):
                  failure = case.find('failure')
                  error = case.find('error')
                  problem = failure if failure is not None else error
                  if problem is None:
                      continue
                  name = case.attrib.get('name', '<unknown>')
                  classname = case.attrib.get('classname', '<unknown>')
                  message = problem.attrib.get('message', '')
                  body = (problem.text or '').strip()
                  print(f'FAILED {classname}.{name}')
                  if message:
                      print(f'MESSAGE: {message}')
                  if body:
                      print(body[:12000])
          print(f'Instrumentation summary: tests={total}, failures={failures}, errors={errors}, skipped={skipped}')
          PY
          find apps/android/app/build/outputs/androidTest-results/connected/debug -name 'TEST-*.xml' -type f -exec cp {} "$diagnostic_dir" \; 2>/dev/null || true

      - name: Collect Android UX screenshot and semantics evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          adb="$ANDROID_HOME/platform-tools/adb"
          evidence_dir='artifacts/android-final-ux/evidence'
          mkdir -p "$evidence_dir"
          names=(
            compact-light-normal
            short-dark-200
            landscape-light-200
            tablet-dark-200
          )
          for name in "${names[@]}"; do
            for suffix in '.png' '-semantics.txt'; do
              source="files/android-ux-evidence/${name}${suffix}"
              target="$evidence_dir/${name}${suffix}"
              if "$adb" shell run-as com.xueqing.app test -f "$source"; then
                "$adb" exec-out run-as com.xueqing.app cat "$source" > "$target"
              fi
            done
          done
          find "$evidence_dir" -maxdepth 1 -type f -print -exec wc -c {} \;

      - name: Verify Android final UX instrumentation evidence executed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections
          import glob
          import xml.etree.ElementTree as ET

          files = glob.glob('apps/android/app/build/outputs/androidTest-results/connected/debug/**/TEST-*.xml', recursive=True)
          test_count = sum(int(ET.parse(path).getroot().attrib.get('tests', '0')) for path in files)
          counts = collections.Counter(
              case.attrib.get('classname', '')
              for path in files
              for case in ET.parse(path).getroot().iter('testcase')
          )
          expected = {
              'com.xueqing.app.presentation.QuickCaptureAccessibilityInstrumentedTest': 1,
              'com.xueqing.app.presentation.QuickCaptureAdaptiveUiInstrumentedTest': 6,
              'com.xueqing.app.presentation.QuickCaptureLifecycleInstrumentedTest': 4,
              'com.xueqing.app.presentation.QuickCaptureMediaReturnInstrumentedTest': 2,
              'com.xueqing.app.presentation.QuickCaptureVisualEvidenceInstrumentedTest': 4,
          }
          print(f'Android instrumentation tests executed: {test_count}')
          for classname, minimum in expected.items():
              actual = counts[classname]
              print(f'{classname}: {actual}')
              if actual < minimum:
                  raise SystemExit(
                      f'Expected at least {minimum} executed tests for {classname}, got {actual}.'
                  )
          if test_count < 60:
              raise SystemExit('Expected at least sixty Android instrumentation tests at the Final UX gate.')
          PY

      - name: Install APKs and seed known draft without uninstalling target app
        shell: bash
        run: |
          set -euo pipefail
          adb="$ANDROID_HOME/platform-tools/adb"
          app_apk='apps/android/app/build/outputs/apk/debug/app-debug.apk'
          test_apk='apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk'

          test -f "$app_apk"
          test -f "$test_apk"
          "$adb" install -r "$app_apk"
          "$adb" install -r "$test_apk"
          "$adb" shell am instrument -w \
            -e class com.xueqing.app.durability.ProcessDeathSeedInstrumentedTest \
            com.xueqing.app.test/androidx.test.runner.AndroidJUnitRunner
          "$adb" shell pm path com.xueqing.app

      - name: Prove force-stop and process restart recovery in UI
        shell: bash
        run: |
          set -euo pipefail
          adb="$ANDROID_HOME/platform-tools/adb"
          sentinel='进程重启证据：这条课堂观察必须从 Room 恢复。'
          attachment_safe='照片已安全保存在本机'

          "$adb" shell am force-stop com.xueqing.app
          "$adb" shell am start -W \
            -n com.xueqing.app/.MainActivity \
            --ez com.xueqing.app.extra.OPEN_QUICK_CAPTURE true

          draft_recovered=0
          for attempt in $(seq 1 30); do
            "$adb" shell uiautomator dump /sdcard/xueqing-window.xml >/dev/null 2>&1 || true
            "$adb" exec-out cat /sdcard/xueqing-window.xml > "$RUNNER_TEMP/xueqing-window.xml" || true
            if grep -Fq "Pixel Launcher isn't responding" "$RUNNER_TEMP/xueqing-window.xml"; then
              # The Ubuntu emulator can surface a system Launcher ANR over the app.
              # Dismiss it without weakening the app-specific recovery assertion.
              "$adb" shell input tap 540 1359 || true
              sleep 1
              continue
            fi
            if grep -Fq "$sentinel" "$RUNNER_TEMP/xueqing-window.xml" &&
               grep -Fq '已恢复本机草稿' "$RUNNER_TEMP/xueqing-window.xml"; then
              draft_recovered=1
              break
            fi
            sleep 1
          done

          if [ "$draft_recovered" -ne 1 ]; then
            cat "$RUNNER_TEMP/xueqing-window.xml" >&2 || true
            exit 1
          fi

          for attempt in $(seq 1 12); do
            "$adb" shell uiautomator dump /sdcard/xueqing-window.xml >/dev/null 2>&1 || true
            "$adb" exec-out cat /sdcard/xueqing-window.xml > "$RUNNER_TEMP/xueqing-window.xml" || true
            if grep -Fq "$attachment_safe" "$RUNNER_TEMP/xueqing-window.xml"; then
              echo 'Process-death recovery proved: encrypted draft and staged attachment are visible after force-stop and relaunch.'
              exit 0
            fi
            "$adb" shell input swipe 540 1650 540 650 300 || true
            sleep 1
          done

          cat "$RUNNER_TEMP/xueqing-window.xml" >&2 || true
          exit 1

      - name: Verify generated Room schema remains committed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          schema_dir='apps/android/app/schemas/com.xueqing.app.durability.DraftDatabase'
          test -f "$schema_dir/1.json"
          test -f "$schema_dir/2.json"
          test -f "$schema_dir/3.json"
          git diff --exit-code -- apps/android/app/schemas

      - name: Print emulator log on failure
        if: failure()
        shell: bash
        run: cat "$RUNNER_TEMP/xueqing-emulator.log" || true

      - name: Upload Android final UX visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-final-ux-visual-evidence
          path: artifacts/android-final-ux/evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Android encrypted-durability diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-encrypted-durability-diagnostics
          path: artifacts/android-draft-durability/diagnostics
          if-no-files-found: warn
          retention-days: 7
