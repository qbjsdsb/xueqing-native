name: android-spike

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-spike-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: android-bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify runner Android SDK and install pinned packages
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          command -v sdkmanager
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          sdkmanager 'platform-tools' 'platforms;android-37' 'build-tools;36.0.0'

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '9.6.0'

      - name: Print Android bootstrap toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          sdkmanager --version

      - name: Run Android unit tests
        shell: bash
        run: |
          set -euo pipefail
          gradle -p apps/android :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android lint
        shell: bash
        run: |
          set -euo pipefail
          gradle -p apps/android :app:lintDebug --no-daemon --stacktrace

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p apps/android :app:assembleDebug --no-daemon --stacktrace
