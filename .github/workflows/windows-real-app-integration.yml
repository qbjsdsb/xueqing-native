name: windows-real-app-integration

on:
  pull_request:
    paths:
      - 'apps/windows/src/Xueqing.Windows/**'
      - 'apps/windows/src/Xueqing.Windows.Infrastructure/**'
      - 'apps/windows/src/Xueqing.Windows.Core/**'
      - 'apps/windows/src/Xueqing.Windows.Presentation/**'
      - 'apps/windows/spikes/Xueqing.Windows.PackagingProbe/Assets/**'
      - 'tools/packaging/run-windows-real-app-integration.ps1'
      - 'tools/deployment/**'
      - 'deployment/**'
      - 'tools/ux/**'
      - 'docs/architecture/WINDOWS_REAL_APP_LOCALSTATE_MSIX.md'
      - 'Directory.Packages.props'
      - '.github/workflows/windows-real-app-integration.yml'

permissions:
  contents: read

concurrency:
  group: windows-real-app-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-app-msix-localstate:
    name: msix-localstate-upgrade
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Stage exact-source production profile
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_COMMIT) { throw 'Windows artifact checkout does not match exact source commit.' }
          python -B tools/deployment/stage_deployment_profile.py deployment/production_profile.template.json $env:SOURCE_COMMIT apps/windows/src/Xueqing.Windows/Deployment/deployment_profile.json
          python -B tools/deployment/verify_deployment_profile.py apps/windows/src/Xueqing.Windows/Deployment/deployment_profile.json

      - name: Setup .NET 10.0.401
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.401'

      - name: Print toolchain
        shell: pwsh
        run: |
          dotnet --info
          dotnet msbuild -version

      - name: Restore locked encrypted infrastructure dependencies
        shell: pwsh
        run: |
          dotnet restore apps/windows/src/Xueqing.Windows.Infrastructure/Xueqing.Windows.Infrastructure.csproj --locked-mode

      - name: Restore real app from committed lock graph
        shell: pwsh
        run: |
          dotnet restore apps/windows/src/Xueqing.Windows/Xueqing.Windows.csproj --locked-mode

      - name: Build real app from committed graph
        shell: pwsh
        run: |
          dotnet build apps/windows/src/Xueqing.Windows/Xueqing.Windows.csproj -c Release --no-restore --nologo

      - name: Build, sign, install, upgrade and validate real app
        shell: pwsh
        env:
          XUEQING_WINDOWS_INTEGRATION_DIAGNOSTIC_OUTPUT: ${{ github.workspace }}\artifacts\windows-real-app-integration\diagnostics\xueqing-app-integration.json
        run: |
          ./tools/packaging/run-windows-real-app-integration.ps1 -RepositoryRoot "$env:GITHUB_WORKSPACE"

      - name: Verify exact deployment profile inside real MSIX artifacts
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($version in @('v1', 'v2')) {
            $package = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "artifacts/windows-real-app-integration/$version") -Recurse -File -Filter *.msix | Where-Object { $_.FullName -notmatch '\\Dependencies\\' } | Select-Object -First 1
            if ($null -eq $package) { throw "Real MSIX not found for $version artifact-profile verification." }
            python -B tools/deployment/verify_native_artifact_profile.py $package.FullName windows-msix $env:SOURCE_COMMIT
          }

      - name: Configure native UX test display
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Start-Sleep -Seconds 2
          Write-Host 'Native UX display configured to 1920x1080 for the 800/960/1024/1280/1600 DIP matrix.'

      - name: Reinstall validated v2 package and run native UX smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageName = 'Xueqing.Native.Development'
          $processName = 'Xueqing.Windows'
          $diagnosticDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows-real-app-integration/diagnostics'
          $evidenceDirectory = Join-Path $diagnosticDirectory 'native-ux-evidence'
          $transcriptPath = Join-Path $diagnosticDirectory 'native-ux-smoke.txt'
          New-Item -ItemType Directory -Force -Path $diagnosticDirectory | Out-Null
          Start-Transcript -Path $transcriptPath -Force | Out-Null

          $certificatePath = Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows-real-app-integration/xueqing-native-real-app.cer'
          $packagePath = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows-real-app-integration/v2') -Recurse -File -Filter *.msix |
            Where-Object { $_.FullName -notmatch '\\Dependencies\\' } |
            Select-Object -First 1

          try {
            if ($null -eq $packagePath) {
              throw 'Validated v2 MSIX was not found for the native UX smoke.'
            }
            if (-not (Test-Path $certificatePath)) {
              throw 'Development certificate was not found for the native UX smoke.'
            }

            $certificate = Import-Certificate -FilePath $certificatePath -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople'
            Add-AppxPackage -Path $packagePath.FullName -ForceApplicationShutdown -ErrorAction Stop
            $package = Get-AppxPackage -Name $packageName -ErrorAction Stop
            $executable = Join-Path $package.InstallLocation "$processName.exe"

            ./tools/ux/run-windows-agent-protocol-smoke.ps1 -ProcessName $processName -ProtocolUri 'xueqing://today' -DiagnosticOutput (Join-Path $diagnosticDirectory 'windows-agent-protocol.json')

            $env:XUEQING_WINDOWS_PROTOTYPE_MODE = '1'
            try {
              Start-Process -FilePath $executable | Out-Null
              ./tools/ux/run-windows-native-ux-smoke.ps1 -ProcessName $processName -EvidenceDirectory $evidenceDirectory
            }
            finally {
              Remove-Item Env:\XUEQING_WINDOWS_PROTOTYPE_MODE -ErrorAction SilentlyContinue
            }

            ./tools/ux/run-windows-agent-quick-capture-smoke.ps1 `
              -ExecutablePath $executable `
              -ProcessName $processName `
              -DiagnosticOutput (Join-Path $diagnosticDirectory 'windows-agent-quick-capture.json')
          }
          finally {
            Get-Process -Name $processName -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
            Get-AppxPackage -Name $packageName -ErrorAction SilentlyContinue |
              ForEach-Object { Remove-AppxPackage -Package $_.PackageFullName -ErrorAction SilentlyContinue }
            if ($null -ne $certificate) {
              Remove-Item "Cert:\LocalMachine\TrustedPeople\$($certificate.Thumbprint)" -Force -ErrorAction SilentlyContinue
            }
            Stop-Transcript -ErrorAction SilentlyContinue | Out-Null
          }

      - name: Prepare downloadable Windows test package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows-real-app-integration'
          $download = Join-Path $root 'download'
          New-Item -ItemType Directory -Force -Path $download | Out-Null

          $msix = Get-ChildItem (Join-Path $root 'v2') -Recurse -File -Filter *.msix |
            Where-Object { $_.FullName -notmatch '\\Dependencies\\' } |
            Select-Object -First 1
          $cer = Join-Path $root 'xueqing-native-real-app.cer'

          if ($null -eq $msix) {
            throw 'Validated v2 MSIX was not found for download packaging.'
          }
          if (-not (Test-Path $cer)) {
            throw 'Development signing certificate was not found for download packaging.'
          }

          Copy-Item $msix.FullName (Join-Path $download 'Xueqing-Windows-Test-x64.msix') -Force
          Copy-Item $cer (Join-Path $download 'Xueqing-Windows-Test.cer') -Force

          $msixOut = Join-Path $download 'Xueqing-Windows-Test-x64.msix'
          $cerOut = Join-Path $download 'Xueqing-Windows-Test.cer'
          $msixHash = (Get-FileHash $msixOut -Algorithm SHA256).Hash.ToLowerInvariant()
          $cerHash = (Get-FileHash $cerOut -Algorithm SHA256).Hash.ToLowerInvariant()

          $event = Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $sourceHead = if ($null -ne $event.pull_request -and $event.pull_request.head.sha) {
            $event.pull_request.head.sha
          } else {
            $env:GITHUB_SHA
          }

          @"
          Xueqing Native Windows test package

          Source PR/head commit: $sourceHead
          Workflow commit: $env:GITHUB_SHA
          Package identity: Xueqing.Native.Development
          Architecture: x64
          Package version: 1.0.1.0
          Signing identity: CN=Xueqing Native Development

          Install for testing:
          1. Open PowerShell as your normal user.
          2. Import the included development certificate:
             Import-Certificate -FilePath .\Xueqing-Windows-Test.cer -CertStoreLocation Cert:\CurrentUser\TrustedPeople
          3. Install the package:
             Add-AppxPackage .\Xueqing-Windows-Test-x64.msix

          This is a development-signed test package, not a production-signed release.
          The certificate is public material; no private signing key is included.
          "@ | Set-Content (Join-Path $download 'INSTALL.txt') -Encoding utf8

          @"
          $msixHash  Xueqing-Windows-Test-x64.msix
          $cerHash  Xueqing-Windows-Test.cer
          "@ | Set-Content (Join-Path $download 'SHA256SUMS.txt') -Encoding ascii

          Get-ChildItem $download | Format-Table Name, Length

      - name: Upload downloadable Windows test package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-test-msix
          path: artifacts/windows-real-app-integration/download
          if-no-files-found: error
          retention-days: 3

      - name: Upload real-app integration diagnostics and UX evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-real-app-integration-diagnostics
          path: artifacts/windows-real-app-integration/diagnostics
          if-no-files-found: warn
          retention-days: 7
