name: windows-spike

on:
  pull_request:
    paths:
      - 'apps/windows/**'
      - 'global.json'
      - 'Directory.Packages.props'
      - '.github/workflows/windows-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-spike-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: windows-core-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Setup .NET 10.0.401
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.401'
      - name: Inspect evaluated MSTest project
        shell: bash
        run: |
          set -euo pipefail
          dotnet msbuild apps/windows/tests/Xueqing.Windows.Core.Tests/Xueqing.Windows.Core.Tests.csproj \
            -getProperty:IsTestApplication \
            -getProperty:OutputType \
            -getProperty:PlatformTarget \
            -getProperty:UseVSTest \
            -getProperty:EnableMSTestRunner \
            -getProperty:EnableMicrosoftTestingPlatform
          dotnet build apps/windows/tests/Xueqing.Windows.Core.Tests/Xueqing.Windows.Core.Tests.csproj -c Release --nologo
          echo '--- test output files ---'
          find apps/windows/tests/Xueqing.Windows.Core.Tests/bin/Release -maxdepth 3 -type f -printf '%p\n' | sort
      - name: Test platform-neutral Windows core
        shell: bash
        run: |
          set +e
          rm -rf TestResults/mtp-diagnostics
          dotnet test \
            --project apps/windows/tests/Xueqing.Windows.Core.Tests/Xueqing.Windows.Core.Tests.csproj \
            -c Release \
            --no-build \
            --nologo \
            --minimum-expected-tests 2 \
            --diagnostic \
            --diagnostic-verbosity Trace \
            --diagnostic-output-directory TestResults/mtp-diagnostics
          code=$?
          if [ "$code" -ne 0 ]; then
            echo '--- MTP diagnostic files ---'
            find TestResults/mtp-diagnostics -type f -maxdepth 2 -print || true
            while IFS= read -r file; do
              echo "--- $file ---"
              tail -n 300 "$file" || true
            done < <(find TestResults/mtp-diagnostics -type f -maxdepth 2 | sort)
          fi
          exit "$code"

  winui-build:
    name: winui-cloud-build
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Setup .NET 10.0.401
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.401'
      - name: Print toolchain
        shell: pwsh
        run: |
          dotnet --info
      - name: Restore locked WinUI dependencies
        shell: pwsh
        run: |
          dotnet restore apps/windows/src/Xueqing.Windows/Xueqing.Windows.csproj --locked-mode
      - name: Build WinUI spike
        shell: pwsh
        run: |
          dotnet build apps/windows/src/Xueqing.Windows/Xueqing.Windows.csproj -c Release --no-restore --nologo -p:PublishReadyToRun=false -p:PublishTrimmed=false
